# Netlify 部署配置
#
# 这是一个纯静态站：npm run build 之后，产物在 dist/ 目录里。
# Netlify 会把它直接托管，不需要任何服务器进程。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 构建时使用 Node 22（和本地开发保持一致的大版本）
  NODE_VERSION = "22"

# 让 Astro 的产物缓存策略更合理：
# _astro/ 里的文件名带内容哈希，所以可以长期缓存。
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 桌宠素材不常变，缓存一周
[[headers]]
  for = "/pet/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"
