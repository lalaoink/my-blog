# Netlify 部署配置
#
# 这是一个纯静态站：npm run build 之后，产物在 dist/ 目录里。
# Netlify 会把它直接托管，不需要任何服务器进程。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 构建时使用 Node 22（和本地开发保持一致的大版本）
  NODE_VERSION = "22"

# 让 Astro 的产物缓存策略更合理：
# _astro/ 里的文件名带内容哈希，所以可以长期缓存。
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 桌宠素材不常变，缓存一周
[[headers]]
  for = "/pet/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ★ 后台的第三方库长期缓存。
#
# 这是「每次进后台都要卡一下」的根治办法：
# 之前 Decap 主体（约 5 MB）走外部 CDN，实测冷缓存要 15.6 秒；
# 而且 Netlify 默认不给静态资源发长期缓存头，导致每次访问都重新下载。
#
# 现在改成自托管 + 一年强缓存：只有第一次需要下载，之后浏览器直接用缓存。
# 升级这些库时记得改文件名（或在文件名后加版本号），否则浏览器不会更新。
[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 后台页面本身不要缓存，否则改了入口后用户看到的还是旧版
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
