# Netlify 部署配置
#
# 这是一个纯静态站：npm run build 之后，产物在 dist/ 目录里。
# Netlify 会把它直接托管，不需要任何服务器进程。

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # 构建时使用 Node 22（和本地开发保持一致的大版本）
  NODE_VERSION = "22"

# 让 Astro 的产物缓存策略更合理：
# _astro/ 里的文件名带内容哈希，所以可以长期缓存。
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# 桌宠素材不常变，缓存一周
[[headers]]
  for = "/pet/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# ⚠️ 规则顺序很重要：Netlify 对同时匹配的多条规则，**后面的覆盖前面的**。
#    所以"更具体的路径"必须写在后面，否则会被宽泛规则吃掉。
#    之前 /admin/vendor/* 写在 /admin/* 前面，结果被 no-cache 覆盖，
#    导致那个 4.93 MB 的 Decap 每次进后台都要重新下载（实测 13.4 秒）。

# 后台页面本身不要缓存，否则改了入口后用户看到的还是旧版
[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ★ 后台的第三方库长期强缓存 —— 必须放在 /admin/* 之后才会生效。
#
# 这是「每次进后台都要卡一下」的根治办法：Decap 主体约 5 MB，
# 一年强缓存后只有第一次需要下载，之后浏览器直接用缓存。
# 升级这些库时记得改文件名（或加版本号），否则浏览器不会更新。
[[headers]]
  for = "/admin/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
