<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Word 导入 · 内容管理</title>
    <style>
      :root {
        --dark-gray: #444;
        --very-dark-gray: #222;
        --gray: #6a6d6e;
        --sea-blue: #316fd3;
        --sand-yellow: #f3ec86;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        padding: 24px 20px 80px;
        background: #f7f7f5;
        color: var(--dark-gray);
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "WenQuanYi Micro Hei", sans-serif;
        line-height: 1.7;
      }
      .wrap { max-width: 940px; margin: 0 auto; }
      h1 { margin: 0 0 4px; font-size: 1.4em; color: var(--very-dark-gray); }
      .sub { margin: 0 0 20px; color: var(--gray); font-size: 0.92em; }
      .card {
        background: #fff;
        border: 2px solid var(--very-dark-gray);
        border-radius: 12px;
        padding: 20px;
        margin-bottom: 18px;
      }
      h2 { font-size: 1.02em; margin: 0 0 12px; color: var(--very-dark-gray); }

      /* 拖放区 */
      #drop {
        border: 2px dashed var(--gray);
        border-radius: 12px;
        padding: 44px 20px;
        text-align: center;
        cursor: pointer;
        transition: all 0.15s ease;
        background: #fbfbfa;
      }
      #drop:hover, #drop.over {
        border-color: var(--sea-blue);
        background: #f4f8ff;
      }
      #drop .big { font-size: 1.05em; color: var(--very-dark-gray); font-weight: 700; }
      #drop .small { font-size: 0.88em; color: var(--gray); margin-top: 6px; }

      /* 表单 */
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .full { grid-column: 1 / -1; }
      label { display: block; font-size: 0.85em; color: var(--gray); margin-bottom: 4px; }
      input[type="text"], input[type="date"], input[type="number"], textarea {
        width: 100%;
        font: inherit;
        font-size: 15px;
        padding: 8px 10px;
        border: 2px solid #cdcdc8;
        border-radius: 8px;
        background: #fff;
        color: var(--dark-gray);
      }
      input:focus, textarea:focus { outline: none; border-color: var(--sea-blue); }
      textarea { resize: vertical; min-height: 62px; }
      .check { display: flex; align-items: center; gap: 8px; font-size: 0.9em; }
      .check input { width: 16px; height: 16px; }

      button {
        font: inherit;
        font-size: 15px;
        padding: 9px 18px;
        border: 2px solid var(--very-dark-gray);
        border-radius: 8px;
        background: #fff;
        cursor: pointer;
        margin: 0 10px 10px 0;
        transition: all 0.15s ease;
      }
      button:hover { background: var(--very-dark-gray); color: #fff; }
      button.primary { background: var(--sea-blue); border-color: var(--sea-blue); color: #fff; }
      button.primary:hover { filter: brightness(1.08); }
      button:disabled { opacity: 0.45; cursor: default; }
      button:disabled:hover { background: #fff; color: inherit; }

      /* 标签页 */
      .tabs { display: flex; gap: 6px; margin-bottom: 12px; border-bottom: 2px solid #e6e5e2; }
      .tabs button {
        border: none;
        border-radius: 0;
        margin: 0;
        padding: 8px 14px;
        background: transparent;
        color: var(--gray);
      }
      .tabs button:hover { background: #f0efec; color: var(--very-dark-gray); }
      .tabs button.active {
        color: var(--very-dark-gray);
        font-weight: 700;
        box-shadow: inset 0 -3px 0 var(--sea-blue);
      }
      .pane { display: none; }
      .pane.active { display: block; }

      #preview {
        border: 1px solid #e6e5e2;
        border-radius: 8px;
        padding: 16px 20px;
        max-height: 460px;
        overflow: auto;
        background: #fff;
      }
      #preview h1, #preview h2, #preview h3 { color: var(--very-dark-gray); }
      #preview img { max-width: 100%; }
      #preview table { border-collapse: collapse; width: 100%; margin: 10px 0; }
      #preview th, #preview td { border: 1px solid #ddd; padding: 5px 8px; font-size: 0.92em; }
      #preview blockquote {
        border-left: 3px solid var(--gray);
        margin: 10px 0;
        padding: 2px 0 2px 12px;
        color: var(--very-dark-gray);
        font-style: italic;
      }
      #preview pre {
        background: #f6f6f4;
        border: 1px solid #e0dfdb;
        border-radius: 6px;
        padding: 10px;
        overflow-x: auto;
      }

      #md {
        width: 100%;
        min-height: 420px;
        font-family: Consolas, Monaco, "Courier New", monospace;
        font-size: 13px;
        line-height: 1.6;
        white-space: pre;
      }

      .status { font-size: 0.9em; margin: 10px 0 0; }
      .status.ok { color: #1a7f37; }
      .status.err { color: #b42318; }
      .note {
        padding: 12px 14px;
        border-left: 3px solid var(--sand-yellow);
        background: #fffdf2;
        font-size: 0.88em;
        color: #5a5a4a;
        border-radius: 0 6px 6px 0;
        margin-top: 14px;
      }
      .note b { color: var(--very-dark-gray); }
      ol { padding-left: 1.3em; }
      ol li { margin: 4px 0; }
      .hide { display: none !important; }
      @media (max-width: 680px) {
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <p style="margin:0 0 14px;font-size:.9em">
        <a href="/admin/" style="color:#316fd3;text-decoration:none">← 返回内容管理</a>
        &nbsp;·&nbsp;
        <a href="/" style="color:#316fd3;text-decoration:none">返回博客主页</a>
      </p>
      <h1>Word 导入</h1>
      <p class="sub">
        把 <code>.docx</code> 转成 Markdown。<b>转换全部在你的浏览器里完成</b>，
        文件不会上传到任何服务器。
      </p>

      <!-- 第 1 步：选文件 -->
      <div class="card">
        <div id="drop">
          <div class="big">把 .docx 文件拖到这里</div>
          <div class="small">或者点击这里选择文件</div>
        </div>
        <input type="file" id="file" accept=".docx" class="hide" />
        <div class="status" id="status"></div>
      </div>

      <!-- 第 2 步：元数据 + 预览（转换后才显示） -->
      <div id="result" class="hide">
        <div class="card">
          <h2>文章信息</h2>
          <div class="grid">
            <div class="full">
              <label>标题（必填）</label>
              <input type="text" id="f-title" />
            </div>
            <div>
              <label>日期</label>
              <input type="date" id="f-date" />
            </div>
            <div>
              <label>标签（用逗号分隔）</label>
              <input type="text" id="f-tags" placeholder="前端, 教程" />
            </div>
            <div class="full">
              <label>摘要（可选，显示在列表页）</label>
              <textarea id="f-desc"></textarea>
            </div>
            <div class="full">
              <label class="check">
                <input type="checkbox" id="f-draft" />
                存为草稿（不发布）
              </label>
            </div>
          </div>
        </div>

        <div class="card">
          <h2>内容</h2>
          <div class="tabs">
            <button id="tab-preview" class="active">预览</button>
            <button id="tab-md">Markdown 源码</button>
          </div>
          <div class="pane active" id="pane-preview"><div id="preview"></div></div>
          <div class="pane" id="pane-md">
            <textarea id="md" spellcheck="false"></textarea>
          </div>
        </div>

        <div class="card">
          <h2>怎么用</h2>
          <ol>
            <li>点下面的 <b>复制 Markdown</b>（含文章开头的 frontmatter）</li>
            <li>打开 <a href="/admin/">内容管理后台</a> → 点 <b>+ 文章</b></li>
            <li>标题、日期等按上面填的填一遍，
              <b>然后把复制的内容整段粘进「正文」框</b></li>
            <li>点 <b>Publish</b>，等一分钟自动上线</li>
          </ol>
          <div>
            <button class="primary" id="btn-copy">复制 Markdown</button>
            <button id="btn-download">下载 .md 文件</button>
            <button id="btn-reset">重新选文件</button>
          </div>
          <div class="status" id="copy-status"></div>
          <div class="note" id="img-note"></div>
        </div>
      </div>
    </div>

    <!-- 自托管，不依赖外部 CDN（见文件顶部说明） -->
    <script src="/admin/vendor/mammoth.browser.min.js"></script>
    <script src="/admin/vendor/turndown.js"></script>
    <script src="/admin/vendor/turndown-plugin-gfm.js"></script>

    <script>
      (function () {
        "use strict";

        var $ = function (id) { return document.getElementById(id); };
        var dropEl = $("drop"), fileEl = $("file"), statusEl = $("status");
        var resultEl = $("result");

        if (!window.mammoth || !window.TurndownService) {
          statusEl.className = "status err";
          statusEl.textContent =
            "转换库加载失败（/admin/vendor/ 下的文件没取到）。请刷新重试。";
          return;
        }

        // ---------- Markdown 转换器 ----------
        var td = new window.TurndownService({
          headingStyle: "atx",      // ## 标题
          codeBlockStyle: "fenced", // ``` 代码块
          bulletListMarker: "-",
          emDelimiter: "*",
          hr: "---",
        });
        // 表格 / 删除线 / 任务列表
        if (window.turndownPluginGfm && window.turndownPluginGfm.gfm) {
          td.use(window.turndownPluginGfm.gfm);
        }

        var markdownBody = "";
        var imageCount = 0;

        // ---------- 拖放 ----------
        dropEl.addEventListener("click", function () { fileEl.click(); });
        dropEl.addEventListener("dragover", function (e) {
          e.preventDefault();
          dropEl.classList.add("over");
        });
        dropEl.addEventListener("dragleave", function () {
          dropEl.classList.remove("over");
        });
        dropEl.addEventListener("drop", function (e) {
          e.preventDefault();
          dropEl.classList.remove("over");
          if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });
        fileEl.addEventListener("change", function () {
          if (fileEl.files.length) handleFile(fileEl.files[0]);
        });

        function setStatus(msg, kind) {
          statusEl.className = "status" + (kind ? " " + kind : "");
          statusEl.textContent = msg || "";
        }

        // ---------- 主流程 ----------
        function handleFile(file) {
          if (!/\.docx$/i.test(file.name)) {
            setStatus(
              "只支持 .docx（Word 2007 之后的新格式）。" +
                "如果你的是旧版 .doc，请先用 Word 另存为 .docx。",
              "err"
            );
            return;
          }
          setStatus("正在转换「" + file.name + "」…", "");

          var reader = new FileReader();
          reader.onload = function () {
            // 图片先占位，避免把 base64 塞进 Markdown 把文件撑爆
            imageCount = 0;
            window.mammoth
              .convertToHtml(
                { arrayBuffer: reader.result },
                {
                  convertImage: window.mammoth.images.imgElement(function () {
                    imageCount++;
                    return { src: "" };
                  }),
                }
              )
              .then(function (res) {
                var html = res.value || "";
                var n = 0;
                html = html.replace(/<img[^>]*>/g, function () {
                  n++;
                  return "<p>［图片 " + n + "：请在上传后用编辑器插入］</p>";
                });

                markdownBody = td.turndown(html);

                // 标题：优先用文档里第一个 h1，其次用文件名
                var h1 = /<h1[^>]*>([\s\S]*?)<\/h1>/i.exec(res.value || "");
                var title = h1
                  ? h1[1].replace(/<[^>]+>/g, "").trim()
                  : file.name.replace(/\.docx$/i, "");
                if (h1) {
                  // h1 已经当标题了，从正文里去掉它，避免重复
                  markdownBody = markdownBody.replace(/^#\s+.*(\r?\n)+/, "");
                }

                $("f-title").value = title;
                $("f-date").value = todayStr();
                $("f-tags").value = "";
                $("f-desc").value = "";
                $("f-draft").checked = false;

                $("preview").innerHTML = html;
                $("md").value = markdownBody;

                resultEl.classList.remove("hide");
                setStatus(
                  "转换完成：正文约 " + markdownBody.length + " 个字符。" +
                    (n ? "文档里有 " + n + " 张图片，已替换成占位文字。" : ""),
                  "ok"
                );
                renderImgNote(n);
                resultEl.scrollIntoView({ behavior: "smooth", block: "start" });
              })
              .catch(function (err) {
                setStatus("转换失败：" + (err && err.message ? err.message : err), "err");
              });
          };
          reader.onerror = function () { setStatus("读取文件失败。", "err"); };
          reader.readAsArrayBuffer(file);
        }

        function renderImgNote(n) {
          var el = $("img-note");
          if (!n) {
            el.innerHTML = "<b>没有检测到图片。</b>";
            return;
          }
          el.innerHTML =
            "<b>这篇文档里有 " + n + " 张图片，已被替换成「［图片 N］」占位文字。</b><br />" +
            "Word 里的图片无法可靠地转成 Markdown，建议：在后台编辑器里，" +
            "把光标放到占位文字处删除它，然后用工具栏的图片按钮上传原图。<br />" +
            "（如果确实想把图片直接塞进 Markdown，会把文件撑到几 MB，" +
            "影响加载速度，所以默认没这么做。）";
        }

        function todayStr() {
          var d = new Date();
          var m = String(d.getMonth() + 1).padStart(2, "0");
          var day = String(d.getDate()).padStart(2, "0");
          return d.getFullYear() + "-" + m + "-" + day;
        }

        // ---------- 组装带 frontmatter 的完整 .md ----------
        function buildFile() {
          var title = $("f-title").value.trim() || "未命名";
          var date = $("f-date").value || todayStr();
          var desc = $("f-desc").value.trim();
          var tags = $("f-tags").value
            .split(/[,，]/)
            .map(function (s) { return s.trim(); })
            .filter(Boolean);
          var draft = $("f-draft").checked;

          var lines = ["---"];
          lines.push("title: " + yamlStr(title));
          lines.push("date: " + date);
          if (desc) lines.push("description: " + yamlStr(desc));
          lines.push(
            "tags: [" + tags.map(function (t) { return yamlStr(t); }).join(", ") + "]"
          );
          lines.push("draft: " + (draft ? "true" : "false"));
          lines.push("---");
          lines.push("");
          var body = $("md").value.replace(/^\s+/, "");
          return lines.join("\n") + body + "\n";
        }

        // YAML 字符串安全转义：有特殊字符就加引号
        function yamlStr(s) {
          if (/^[\w\u4e00-\u9fa5][\w\u4e00-\u9fa5 \-]*$/.test(s)) return s;
          return '"' + s.replace(/\\/g, "\\\\").replace(/"/g, '\\"') + '"';
        }

        // ---------- 按钮 ----------
        $("btn-copy").addEventListener("click", function () {
          var text = buildFile();
          var cs = $("copy-status");
          var done = function () {
            cs.className = "status ok";
            cs.textContent = "已复制。去 内容管理后台 → + 文章，把内容粘进「正文」。";
          };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function () {
              fallbackCopy(text, cs);
            });
          } else {
            fallbackCopy(text, cs);
          }
        });

        function fallbackCopy(text, cs) {
          // 老浏览器 / 非 HTTPS 环境下的兜底
          var ta = document.createElement("textarea");
          ta.value = text;
          ta.style.position = "fixed";
          ta.style.top = "-1000px";
          document.body.appendChild(ta);
          ta.select();
          try {
            document.execCommand("copy");
            cs.className = "status ok";
            cs.textContent = "已复制。";
          } catch (e) {
            cs.className = "status err";
            cs.textContent = "复制失败，请切到「Markdown 源码」标签手动全选复制。";
          }
          document.body.removeChild(ta);
        }

        $("btn-download").addEventListener("click", function () {
          var blob = new Blob([buildFile()], { type: "text/markdown;charset=utf-8" });
          var a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          a.download = ($("f-title").value.trim() || "article") + ".md";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(function () { URL.revokeObjectURL(a.href); }, 3000);
        });

        $("btn-reset").addEventListener("click", function () {
          resultEl.classList.add("hide");
          fileEl.value = "";
          setStatus("");
          window.scrollTo({ top: 0, behavior: "smooth" });
        });

        // 标签页切换
        $("tab-preview").addEventListener("click", function () { switchTab("preview"); });
        $("tab-md").addEventListener("click", function () { switchTab("md"); });
        function switchTab(which) {
          $("tab-preview").classList.toggle("active", which === "preview");
          $("tab-md").classList.toggle("active", which === "md");
          $("pane-preview").classList.toggle("active", which === "preview");
          $("pane-md").classList.toggle("active", which === "md");
        }

        // Markdown 源码改动 → 同步回内部状态
        $("md").addEventListener("input", function () {
          markdownBody = $("md").value;
        });

        // 标题改动 → 更新下载文件名（无副作用，仅提示）
        $("f-title").addEventListener("input", function () {
          document.title = ($("f-title").value || "Word 导入") + " · Word 导入";
        });
      })();
    </script>
  </body>
</html>
