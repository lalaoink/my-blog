<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 管理后台不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · 言与叶之庭</title>
  </head>
  <body>
    <!--
      Sveltia CMS —— Decap CMS 的现代替代实现。
      只需这一个 script 标签，界面和配置全部由同目录的 config.yml 决定。

      它加载后会自动读取 ./config.yml，要求你登录 GitHub（或 Netlify Identity），
      然后就能在网页上新建 / 修改 / 删除文章，改动会直接提交到仓库。
    -->
    <script
      src="https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js"
      type="module"
    ></script>
  </body>
</html>
