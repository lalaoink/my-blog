<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 管理后台不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · 言与叶之庭</title>

    <!--
      ★ 预加载：让浏览器一解析到 <head> 就开始下载 Decap 主体，
        而不是等解析到 <script> 才开始。省掉几百毫秒的等待。
    -->
    <link rel="preload" as="script" href="/admin/vendor/decap-cms.js" />

    <style>
      /* 首屏骨架：Decap（约 5 MB）下载+解析期间先显示这个，
         避免白屏，也让"正在加载"这件事有反馈 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f7f7f5;
        color: #6a6d6e;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "WenQuanYi Micro Hei", sans-serif;
        font-size: 14px;
        z-index: 10;
        transition: opacity 0.25s ease;
      }
      #boot.done { opacity: 0; pointer-events: none; }
      #boot .ring {
        width: 26px;
        height: 26px;
        border: 3px solid #dcdcd6;
        border-top-color: #316fd3;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }

      /*
        右下角悬浮工具条。
        做成固定悬浮层，而不是注入 Decap 的 DOM ——
        Decap 是 React 应用，界面结构会随版本变化，
        直接塞进去很容易在升级后失效；悬浮层则一直有效。
      */
      #admin-tools {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 2147483000;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "WenQuanYi Micro Hei", sans-serif;
      }
      #admin-tools a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        border: 2px solid #222;
        border-radius: 8px;
        background: #fff;
        color: #222;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      #admin-tools a:hover { transform: translateY(-2px); }
      #admin-tools a.primary { background: #316fd3; border-color: #316fd3; color: #fff; }
      #admin-tools a.primary:hover { background: #2655b9; border-color: #2655b9; }
      #admin-tools a.ghost:hover { background: #222; color: #fff; }

      @media (max-width: 600px) {
        #admin-tools { right: 12px; bottom: 12px; gap: 8px; }
        #admin-tools a { padding: 8px 12px; font-size: 13px; }
      }
    </style>
  </head>
  <body>
    <!-- 加载指示，Decap 就绪后移除 -->
    <div id="boot"><div class="ring"></div><div>正在加载内容管理…</div></div>

    <!--
      ★★★ 这里必须用自托管的 Decap，不要改回 CDN ★★★

      实测：从 cdn.jsdelivr.net 冷缓存拉这个文件要 15.6 秒，
      从本站自己的 Netlify 只要 1 秒出头。用户的网络访问外部 CDN 不稳定。

      同时 netlify.toml 给 /admin/vendor/* 加了长期缓存头，
      所以只有第一次访问需要下载，之后浏览器直接用缓存 —— 秒开。
    -->
    <script src="/admin/vendor/decap-cms.js"></script>

    <!--
      兜底：万一本地文件没取到（例如刚部署完 CDN 还没同步），
      再回退到外部 CDN。正常情况下这段不会执行。
    -->
    <script>
      if (!window.CMS) {
        document.write(
          '<script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"><\/script>'
        );
      }
    </script>

    <!--
      注册 Markdown 编辑器工具栏上的「Word 导入」按钮。
      用的是 Decap 官方扩展点 CMS.registerEditorComponent。

      ⚠️ 注意它到底能做什么：
      官方 API 的编辑器组件只能"往正文里插入内容"，
      不支持"点击后打开一个外部页面"。所以这个按钮不能直接跳到
      /admin/word 转换页 —— 那是浏览器的限制，不是配置问题。

      它实际的作用是：在编辑器里提供一个**粘贴入口**，
      让你不用离开文章就能把转换好的 Markdown 插进正文，
      同时在提示里告诉你转换页的地址。

      这段必须放在 Decap 脚本之后、DOMContentLoaded 之前执行，
      这样组件才会在 Decap 初始化前注册好。当前位置即满足。
    -->
    <script>
      (function () {
        if (!window.CMS || !window.CMS.registerEditorComponent) return;

        window.CMS.registerEditorComponent({
          id: "word-import",
          label: "📄 Word 导入",
          // pattern / fromBlock 用于识别已有的块；这里插入的是纯 Markdown，
          // 所以不需要包裹标记，识别不到也无所谓。
          pattern: /^{{word-import}}([\s\S]*?){{\/word-import}}$/,
          fromBlock: function (match) {
            return { text: (match[1] || "").trim() };
          },
          // 关键：返回纯 Markdown，直接落进正文，不留下任何短代码包裹
          toBlock: function (obj) {
            return (obj.text || "").trim();
          },
          toPreview: function (obj) {
            return obj.text || "";
          },
          fields: [
            {
              name: "text",
              label: "粘贴 Markdown",
              widget: "text",
              hint:
                "转换步骤：新开一个标签页打开  /admin/word  →  拖入 .docx  →  " +
                "点「复制 Markdown」→ 回到这里粘贴 → 点插入。",
            },
          ],
        });
      })();
    </script>

    <script>
      // Decap 挂载完成后淡出加载指示
      (function () {
        var boot = document.getElementById("boot");
        var tries = 0;
        var timer = setInterval(function () {
          tries++;
          var ready =
            document.querySelector("#nc-root") ||
            document.querySelector("form") ||
            document.body.children.length > 2;
          if (ready || tries > 100) {
            clearInterval(timer);
            boot.classList.add("done");
            setTimeout(function () { boot.remove(); }, 400);
          }
        }, 60);
      })();
    </script>

    <div id="admin-tools">
      <a
        class="primary"
        href="/admin/word"
        title="把 Word (.docx) 转成 Markdown 再贴进文章"
        >📄 Word 导入</a
      >
      <a class="ghost" href="/" title="回到博客首页">← 返回主页</a>
    </div>
  </body>
</html>
