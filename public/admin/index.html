<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 管理后台不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · 言与叶之庭</title>
    <style>
      /*
        后台右下角的悬浮工具条。
        做成固定悬浮层，而不是注入 Decap 的 DOM ——
        Decap 是 React 应用，界面结构会随版本变化，
        直接塞进去很容易在升级后失效；悬浮层则一直有效。
        位置选右下角，避开它的顶栏（快速新建 / 头像）和左侧集合列表。
      */
      #admin-tools {
        position: fixed;
        right: 20px;
        bottom: 20px;
        z-index: 2147483000; /* 高于 Decap 的所有浮层 */
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 10px;
        font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei",
          "WenQuanYi Micro Hei", sans-serif;
      }
      #admin-tools a {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 10px 16px;
        font-size: 14px;
        font-weight: 700;
        line-height: 1;
        text-decoration: none;
        border: 2px solid #222;
        border-radius: 8px;
        background: #fff;
        color: #222;
        box-shadow: 0 6px 16px rgba(0, 0, 0, 0.14);
        transition: all 0.15s ease;
        white-space: nowrap;
      }
      #admin-tools a:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 22px rgba(0, 0, 0, 0.2);
      }
      #admin-tools a:active {
        transform: translateY(0);
      }
      /* Word 导入是主动作，用主色突出 */
      #admin-tools a.primary {
        background: #316fd3;
        border-color: #316fd3;
        color: #fff;
      }
      #admin-tools a.primary:hover {
        background: #2655b9;
        border-color: #2655b9;
        box-shadow: 0 10px 22px rgba(49, 111, 211, 0.4);
      }
      #admin-tools a.ghost:hover {
        background: #222;
        color: #fff;
      }
      /* 小屏上缩小，别挡内容 */
      @media (max-width: 600px) {
        #admin-tools {
          right: 12px;
          bottom: 12px;
          gap: 8px;
        }
        #admin-tools a {
          padding: 8px 12px;
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <!--
      ⚠️ 必须用 Decap CMS，不能改成 Sveltia CMS。
      Sveltia 只支持 github / gitlab / gitea / test-repo 四种后端，
      明确不支持下面的 git-gateway，用它会直接报配置错误。
      Decap 是 Git Gateway 的原生支持者。
    -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <!-- 悬浮工具条：放在 Decap 脚本之后，确保渲染在最上层 -->
    <div id="admin-tools">
      <a
        class="primary"
        href="/admin/word"
        title="把 Word (.docx) 转成 Markdown 再贴进文章"
        >📄 Word 导入</a
      >
      <a class="ghost" href="/" title="回到博客首页">← 返回主页</a>
    </div>
  </body>
</html>
