<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 管理后台不该被搜索引擎收录 -->
    <meta name="robots" content="noindex, nofollow" />
    <title>内容管理 · 言与叶之庭</title>
  </head>
  <body>
    <!--
      Decap CMS —— 注意这里【不能】用 Sveltia CMS。
      Sveltia 只支持 github / gitlab / gitea / test-repo 四种后端，
      明确不支持 Netlify 的 Git Gateway；用它会直接报
      "backend.name 选项必须是以下值之一…"。

      Decap 是 Git Gateway 的原生支持者，所以我们用 Netlify Identity 登录。

      界面与可编辑范围全部由同目录的 config.yml 决定。
    -->
    <script src="https://cdn.jsdelivr.net/npm/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
